<svg xmlns="http://www.w3.org/2000/svg" width="450" height="160" viewBox="0 0 450 160">
  <defs>
    <style>
      .sig-path {
        fill: none;
        stroke: #1e3a5f;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sig-flourish {
        fill: none;
        stroke: #00c853;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
    </style>
  </defs>
